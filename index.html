<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Unity WebGL Player | ph metr</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #unity-container {
        width: 100vw;
        height: 100vh;
        position: relative;
      }

      /* Mobile keyboard interceptor */
      .keyboard-interceptor {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        opacity: 0;
        pointer-events: none;
      }

      .keyboard-interceptor.active {
        pointer-events: all;
      }

      .hidden-input {
        position: fixed;
        top: -9999px;
        left: -9999px;
        width: 0;
        height: 0;
        opacity: 0;
        z-index: 10000;
      }
    </style>
  </head>
  <body>
    <!-- Hidden input for keyboard trigger -->
    <input type="text" id="hidden-username-input" class="hidden-input" inputmode="text" />
    <input type="password" id="hidden-password-input" class="hidden-input" inputmode="password" />
    <textarea id="hidden-text-input" class="hidden-input"></textarea>

    <!-- Unity Game Container - Full Screen -->
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">ph metr</div>
      </div>
    </div>

    <script>

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/EduLab_Safa_Khaoula.loader.js";
      var config = {
        dataUrl: buildUrl + "/EduLab_Safa_Khaoula.data",
        frameworkUrl: buildUrl + "/EduLab_Safa_Khaoula.framework.js",
        codeUrl: buildUrl + "/EduLab_Safa_Khaoula.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "ph metr",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                  unityInstance.SetFullscreen(1);
                };
              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>

    <!-- Keyboard Interceptor Script -->
    <script>
      console.log('Keyboard interceptor script loaded');

      // Global keyboard manager
      var KeyboardManager = {
        currentInput: null,
        isKeyboardOpen: false,

        init: function() {
          console.log('KeyboardManager initialized');
          
          // Listen for Unity clicks that might trigger input fields
          this.setupInputDetection();
          
          // Setup hidden inputs
          this.setupHiddenInputs();
          
          // Use MutationObserver to detect dynamically created input fields
          this.observeDOMChanges();
        },

        setupHiddenInputs: function() {
          var usernameInput = document.getElementById('hidden-username-input');
          var passwordInput = document.getElementById('hidden-password-input');
          var textInput = document.getElementById('hidden-text-input');

          usernameInput.addEventListener('focus', () => {
            this.isKeyboardOpen = true;
            console.log('Username input focused - keyboard should appear');
          });

          passwordInput.addEventListener('focus', () => {
            this.isKeyboardOpen = true;
            console.log('Password input focused - keyboard should appear');
          });

          textInput.addEventListener('focus', () => {
            this.isKeyboardOpen = true;
            console.log('Text input focused - keyboard should appear');
          });

          [usernameInput, passwordInput, textInput].forEach(input => {
            input.addEventListener('blur', () => {
              this.isKeyboardOpen = false;
              console.log('Input blurred - keyboard hidden');
            });
          });
        },

        setupInputDetection: function() {
          var canvas = document.getElementById('unity-canvas');
          if (!canvas) return;

          canvas.addEventListener('click', (e) => {
            console.log('Canvas clicked at:', e.clientX, e.clientY);
            this.checkForInputFieldsNearClick(e.clientX, e.clientY);
          });

          canvas.addEventListener('touchend', (e) => {
            if (e.changedTouches.length > 0) {
              var touch = e.changedTouches[0];
              console.log('Canvas touched at:', touch.clientX, touch.clientY);
              this.checkForInputFieldsNearClick(touch.clientX, touch.clientY);
            }
          });
        },

        checkForInputFieldsNearClick: function(x, y) {
          // Check if click is on input fields within Unity
          // This triggers the hidden input to show the keyboard
          
          var hiddenUsername = document.getElementById('hidden-username-input');
          var hiddenPassword = document.getElementById('hidden-password-input');
          var hiddenText = document.getElementById('hidden-text-input');

          // Detect by proximity or you can add specific coordinates
          // For now, we'll trigger based on common login screen areas
          
          console.log('Checking for input fields near click');
          
          // Example: if click is on left side (username field area)
          if (x < window.innerWidth * 0.6) {
            setTimeout(() => {
              hiddenUsername.focus();
              hiddenUsername.click();
              console.log('Username keyboard triggered');
            }, 50);
          }
        },

        observeDOMChanges: function() {
          var observer = new MutationObserver((mutations) => {
            console.log('DOM changes detected');
            
            // Check for newly added input fields
            mutations.forEach((mutation) => {
              if (mutation.addedNodes.length > 0) {
                mutation.addedNodes.forEach((node) => {
                  if (node.tagName === 'INPUT' || node.tagName === 'TEXTAREA') {
                    console.log('New input field detected:', node);
                    this.attachKeyboardListener(node);
                  }
                });
              }
            });
          });

          observer.observe(document.body, {
            childList: true,
            subtree: true
          });
        },

        attachKeyboardListener: function(input) {
          input.addEventListener('focus', () => {
            console.log('Input focused:', input);
            this.isKeyboardOpen = true;
          });

          input.addEventListener('blur', () => {
            this.isKeyboardOpen = false;
          });
        },

        // Function to manually open keyboard for specific field type
        openKeyboardForField: function(fieldType) {
          if (fieldType === 'username') {
            document.getElementById('hidden-username-input').focus();
            document.getElementById('hidden-username-input').click();
          } else if (fieldType === 'password') {
            document.getElementById('hidden-password-input').focus();
            document.getElementById('hidden-password-input').click();
          }
        }
      };

      // Initialize on document ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
          KeyboardManager.init();
        });
      } else {
        KeyboardManager.init();
      }

      // Global access for Unity communication
      window.KeyboardManager = KeyboardManager;
      console.log('Keyboard manager available as window.KeyboardManager');
    </script>
  </body>
</html>
